<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:13px/1.6 system-ui;margin:0;padding:20px;color:#26302a;background:#fafaf8}h1{font-size:20px}h2{font-size:14px;margin:0 0 10px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{border:1px solid #8885;border-radius:6px;padding:14px}header{display:flex;align-items:center;gap:18px}small{opacity:.7}p{margin:10px 0}button{font:inherit;color:inherit;background:none;border:1px solid #8886;border-radius:5px;display:flex;align-items:center;gap:7px;padding:6px 9px}.dark{background:#232724;color:#eff2ee}</style><h1>既有圖示替代 · 原生 16 / 20 / 24px</h1><p>只展示既有替代與操作情境，不取回被撤銷的變體圖稿。</p><main><article><h2>stroke-double → equal</h2><header><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3.3333 6L12.6667 6"/><path d="M3.3333 10L12.6667 10"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M4.1667 7.5L15.8333 7.5"/><path d="M4.1667 12.5L15.8333 12.5"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M5 9L19 9"/><path d="M5 15L19 15"/></svg></header><p><small>邊框樣式選單 · 與實線、虛線及點線並列</small></p><div style="border:1px solid #8886;border-radius:6px;padding:10px"><b>儲存格邊框樣式</b><div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 8L13 8"/></svg>實線</button><button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 8L6.75 8" stroke-linecap="butt"/><path d="M9.25 8L13 8" stroke-linecap="butt"/></svg>虛線</button><button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><circle cx="3" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="5.5" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="10.5" cy="8" r="0.75" fill="currentColor" stroke="none"/><circle cx="13" cy="8" r="0.75" fill="currentColor" stroke="none"/></svg>點線</button><button aria-pressed="true" style="background:#8882;border-color:currentColor"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3.3333 6L12.6667 6"/><path d="M3.3333 10L12.6667 10"/></svg>雙線</button></div><div style="padding:10px;width:160px;border-bottom:4px double currentColor">合計　1,250</div></div><p>既有 equal 已是等長、平行、分離的兩條橫線；在明確標示邊框樣式的選單中，搭配「雙線」即可表示雙線值。再建立同樣的雙橫線只會重複命名及幾何。</p><p><small>適用範圍：限於有雙線標籤的線型選單；equal 仍保留原本等於的數學名稱。若要預覽不同雙線間距或粗細，應由實際邊框樣式繪製預覽，不新增每種比例的圖示。</small></p></article></main>
