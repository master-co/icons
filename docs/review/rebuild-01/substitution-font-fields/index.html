<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:13px/1.6 system-ui;margin:0;padding:20px;color:#26302a;background:#fafaf8}h1{font-size:20px}h2{font-size:14px;margin:0 0 10px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{border:1px solid #8885;border-radius:6px;padding:14px}header{display:flex;align-items:center;gap:18px}small{opacity:.7}p{margin:10px 0}button{font:inherit;color:inherit;background:none;border:1px solid #8886;border-radius:5px;display:flex;align-items:center;gap:7px;padding:6px 9px}.dark{background:#232724;color:#eff2ee}</style><h1>既有圖示替代 · 原生 16 / 20 / 24px</h1><p>只展示既有替代與操作情境，不取回被撤銷的變體圖稿。</p><main><article><h2>font-family → text</h2><header><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 4.6667L3 2.8667A0.2 0.2 0 0 1 3.2 2.6667L12.8 2.6667A0.2 0.2 0 0 1 13 2.8667L13 4.6667"/><path d="M8 2.6667L8 13.3333"/><path d="M5.6667 13.3333L10.3333 13.3333"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3.75 5.8333L3.75 3.5333A0.2 0.2 0 0 1 3.95 3.3333L16.05 3.3333A0.2 0.2 0 0 1 16.25 3.5333L16.25 5.8333"/><path d="M10 3.3333L10 16.6667"/><path d="M7.0833 16.6667L12.9167 16.6667"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M4.5 7L4.5 4.2A0.2 0.2 0 0 1 4.7 4L19.3 4A0.2 0.2 0 0 1 19.5 4.2L19.5 7"/><path d="M12 4L12 20"/><path d="M8.5 20L15.5 20"/></svg></header><p><small>文字工具列 · 字型名稱選擇器</small></p><button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 4.6667L3 2.8667A0.2 0.2 0 0 1 3.2 2.6667L12.8 2.6667A0.2 0.2 0 0 1 13 2.8667L13 4.6667"/><path d="M8 2.6667L8 13.3333"/><path d="M5.6667 13.3333L10.3333 13.3333"/></svg>字型：Inter ▾</button><p>欄位直接顯示目前字型名稱，旁邊有下拉箭頭；既有 text 足以標示文字屬性，不需要為字型清單再畫一種 Aa。使用端也可只顯示字型名稱。</p></article><article><h2>font-size → text</h2><header><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 4.6667L3 2.8667A0.2 0.2 0 0 1 3.2 2.6667L12.8 2.6667A0.2 0.2 0 0 1 13 2.8667L13 4.6667"/><path d="M8 2.6667L8 13.3333"/><path d="M5.6667 13.3333L10.3333 13.3333"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3.75 5.8333L3.75 3.5333A0.2 0.2 0 0 1 3.95 3.3333L16.05 3.3333A0.2 0.2 0 0 1 16.25 3.5333L16.25 5.8333"/><path d="M10 3.3333L10 16.6667"/><path d="M7.0833 16.6667L12.9167 16.6667"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M4.5 7L4.5 4.2A0.2 0.2 0 0 1 4.7 4L19.3 4A0.2 0.2 0 0 1 19.5 4.2L19.5 7"/><path d="M12 4L12 20"/><path d="M8.5 20L15.5 20"/></svg></header><p><small>文字工具列 · 字級數值欄位</small></p><button><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" color="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="3" focusable="false" aria-hidden="true"><path d="M3 4.6667L3 2.8667A0.2 0.2 0 0 1 3.2 2.6667L12.8 2.6667A0.2 0.2 0 0 1 13 2.8667L13 4.6667"/><path d="M8 2.6667L8 13.3333"/><path d="M5.6667 13.3333L10.3333 13.3333"/></svg>字級：16 px ▾</button><p>數字、單位和字級標籤已交代調整對象；沿用 text 與數值即可。再畫大小不同的 AA 會與小型大寫控制衝突，而單純字級選擇器不需第二組字形圖稿。</p></article></main>
