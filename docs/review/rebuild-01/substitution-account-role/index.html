<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{font:13px/1.6 system-ui;margin:0;padding:20px;color:#26302a;background:#fafaf8}h1{font-size:20px}h2{font-size:14px;margin:0 0 10px}main{display:grid;grid-template-columns:1fr 1fr;gap:14px}article{border:1px solid #8885;border-radius:6px;padding:14px}header{display:flex;align-items:center;gap:18px}small{opacity:.7}p{margin:10px 0}button{font:inherit;color:inherit;background:none;border:1px solid #8886;border-radius:5px;display:flex;align-items:center;gap:7px;padding:6px 9px}.dark{background:#232724;color:#eff2ee}</style><h1>收錄判斷 · 既有圖示與內容預覽</h1><p>不取回被撤銷的變體圖稿。圖示與色塊以 16／20／24px 顯示；文字及公式使用相同數值的字級、保留自然高度，不是固定尺寸圖示。</p><main><article><h2>user-shield → 實際角色名稱</h2><header><span>管理員　成員　檢視者</span></header><p><small>成員管理 · 角色與權限</small></p><style>[data-account-demo] button{display:inline-flex;margin:3px 4px 3px 0}[data-account-demo] input,[data-account-demo] select{font:inherit;color:inherit;background:transparent;padding:6px;border:1px solid #8887;max-width:100%}[data-account-demo] input[type="checkbox"]{padding:0}[data-account-demo] ul{list-style:none;padding:0}[data-account-demo] li{padding:7px 0;border-bottom:1px solid #8884}[data-account-demo] .person{display:flex;align-items:center;gap:8px;margin:10px 0}[data-account-demo] .avatar{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid #8886;border-radius:50%;flex-shrink:0}[data-account-demo] .state{display:inline-flex;align-items:center;gap:6px;border:1px solid #8886;padding:3px 7px;border-radius:4px}[data-account-demo] [aria-current="true"]{box-shadow:inset 0 0 0 1px currentColor}[data-account-demo] small{display:block}.dark [data-account-demo]{color-scheme:dark}</style><div data-account-demo="role"><div class="person"><span class="avatar" aria-hidden="true">吳</span><span>吳美宜<small>mei@example.test</small></span></div><label>工作區角色 <select data-account-role><option value="admin" selected>管理員</option><option value="member">成員</option><option value="viewer">檢視者</option></select></label><p><span class="state" data-role-badge>管理員</span></p><p data-role-description>管理工作區與成員。</p><p>帳號狀態：正常</p><p><small>本地狀態示例，不寄信、不變更任何真實帳號或權限。</small></p></div><p>管理員、成員、檢視者是具體角色值。文字標籤直接表達權限，盾牌易與安全驗證、受保護帳號混淆，不能當成角色同義詞。</p><p><small>適用範圍：角色欄位與角色選單；角色變更不改變帳號啟用狀態。</small></p></article></main><script>(function accountInteraction(){
 for(const root of document.querySelectorAll('[data-account-demo]')){
  const q=s=>root.querySelector(s);
  if(root.dataset.accountDemo==='remove'){const update=()=>{const count=root.querySelectorAll('[data-member-select]:checked').length;q('[data-remove-label]').textContent='移除 '+count+' 位成員';q('[data-members-remove]').disabled=!count;};root.addEventListener('change',update);update();}
  root.addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   if(b.hasAttribute('data-account-open')){const show=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(show));q('[data-account-menu]').hidden=!show;}
   if(b.hasAttribute('data-account-choice')){for(const other of root.querySelectorAll('[data-account-choice]'))other.setAttribute('aria-current',String(other===b));const name=b.dataset.accountChoice==='yuan'?'林予安':'陳以恩',email=b.dataset.accountChoice==='yuan'?'yuan@example.test':'chen@example.test';q('[data-current-account]').replaceChildren();const person=document.createElement('div');person.className='person';const avatar=document.createElement('span');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=name[0];const label=document.createElement('span'),small=document.createElement('small');label.textContent=name;small.textContent=email;label.append(small);person.append(avatar,label);q('[data-current-account]').append(person);q('[data-account-menu]').hidden=true;q('[data-account-open]').setAttribute('aria-expanded','false');q('[data-account-switch-status]').textContent='目前使用 '+email+'；其他帳號仍保持登入（示例）。';}
   if(b.hasAttribute('data-invite-send')){const values=[...new Set(q('[data-invite-emails]').value.split(',').map(s=>s.trim()).filter(Boolean))];if(!values.length||values.some(v=>!/^\S+@\S+\.\S+$/.test(v))){q('[data-invite-status]').textContent='請輸入有效的電子郵件，以逗號分隔。';return;}const existing=new Set([...root.querySelectorAll('[data-invite-email]')].map(el=>el.dataset.inviteEmail));const added=values.filter(v=>!existing.has(v));for(const email of added){const li=document.createElement('li');li.dataset.inviteEmail=email;li.textContent=email+' · 待接受邀請';q('[data-invite-list]').append(li);}q('[data-invite-status]').textContent=added.length?'已將 '+added.length+' 位成員加入待接受名單（示例）。':'這些成員已在待接受名單中。';}
   if(b.hasAttribute('data-members-remove')){const checked=[...root.querySelectorAll('[data-member-select]:checked')];for(const checkbox of checked)checkbox.closest('[data-member]').remove();q('[data-remove-status]').textContent='已移除 '+checked.length+' 位工作區成員；帳號與個人資料仍保留（示例）。';q('[data-remove-label]').textContent='移除 0 位成員';b.disabled=true;}
   if(b.hasAttribute('data-lock-details-open')){const show=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',String(show));q('[data-lock-details]').hidden=!show;}
   if(b.hasAttribute('data-invite-resend'))q('[data-resend-status]').textContent='已模擬重新寄送；狀態仍是待接受邀請。';
   if(b.hasAttribute('data-account-restore')){q('[data-disabled-state]').innerHTML='<span class="state">正常</span>';q('[data-restore-status]').textContent='帳號已恢復（示例）；原有 12 份文件仍保留。';b.disabled=true;}
  });
  root.addEventListener('change',e=>{if(!e.target.hasAttribute('data-account-role'))return;const roles={admin:['管理員','管理工作區與成員。'],member:['成員','編輯工作區內容。'],viewer:['檢視者','唯讀檢視工作區內容。']},[label,description]=roles[e.target.value];q('[data-role-badge]').textContent=label;q('[data-role-description]').textContent=description;});
 }
})()</script><script>function pageControls(e){const t=e.target,f=t.closest('fieldset');if(!f)return;if(t.hasAttribute('data-paper-orientation')){const p=f.querySelector('[data-orientation-preview]');p.style.width=(t.value==='portrait'?90:127)+'px';p.style.height=(t.value==='portrait'?127:90)+'px';}if(t.hasAttribute('data-margin-side'))f.querySelector('[data-margin-preview]').style['padding'+t.dataset.marginSide[0].toUpperCase()+t.dataset.marginSide.slice(1)]=(Math.max(0,Math.min(60,Number(t.value)))*.6)+'px';if(t.hasAttribute('data-page-layout'))f.querySelector('[data-second-page]').hidden=t.value==='single';if(t.hasAttribute('data-fit-mode')){const p=f.querySelector('[data-fit-paper]');p.style.width=(t.value==='width'?158:138*Math.SQRT2)+'px';p.style.height=(t.value==='width'?158/Math.SQRT2:138)+'px';}}document.addEventListener('change',pageControls);document.addEventListener('input',pageControls);document.addEventListener('change',e=>{const t=e.target,f=t.closest('fieldset');if(!f)return;if(t.hasAttribute('data-gradient-css'))f.querySelector('[data-gradient-preview]').style.background=t.dataset.gradientCss;if(t.hasAttribute('data-text-style'))f.querySelector('[data-effect-preview]').style.cssText='display:inline-block;padding:6px 3px;font-size:24px;line-height:1.5;'+t.dataset.textStyle;});</script>
