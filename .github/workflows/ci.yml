name: CI
# Pull requests run it here; every push to main runs it as the first job of the Release workflow.
on:
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Run only the release gates. Release passes true; the development checks run on pull requests and manual runs.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Called from Release, github.workflow names the caller, so keep the group apart from Release's own.
  group: CI-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One Node version, three jobs side by side: a run takes as long as its slowest job, not their sum.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 26
      # The commit hook and the PR title check already apply the policy; a direct push can skip both,
      # so check every pushed commit again here.
      - name: Check pushed commits against the release policy
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A new branch has no previous tip, and a force push may drop it; check the head commit then.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            from="${AFTER}~1"
          else
            from="$BEFORE"
          fi
          bun x aronrepo check --from "$from" --to "$AFTER"
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-packages-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-packages-${{ hashFiles('bun.lock') }}-
      - run: bun run check:release
      - run: bun run test:turbo
      - run: bun run check
      # Development checks: they protect the build process and the local dev experience, not the published
      # packages or the deployed site, so they never gate a release (called from Release with release: true).
      - if: ${{ !inputs.release }}
        run: bun run check:reproducible
      - run: bun run check:package
      - run: git diff --exit-code -- packages/icons/icons

  # The browser jobs run in the Playwright image of the locked @playwright/test version: its browsers and
  # their system libraries are already installed, so no job downloads them from a package mirror.
  # scripts/release-config-check.mjs holds the tag to bun.lock.
  review-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root # Firefox refuses a home directory that another user owns
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install unzip for the Bun setup when the image lacks it
        run: command -v unzip >/dev/null || (apt-get update && apt-get install --yes --no-install-recommends unzip)
      - uses: ./.github/actions/setup
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-review-browser-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-review-browser-${{ hashFiles('bun.lock') }}-
      - run: bun run test:frameworks:browser
      - run: bun run test:browser

  site-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root # Firefox refuses a home directory that another user owns
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install unzip for the Bun setup when the image lacks it
        run: command -v unzip >/dev/null || (apt-get update && apt-get install --yes --no-install-recommends unzip)
      - uses: ./.github/actions/setup
        with:
          node-version: 26
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-site-browser-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-site-browser-${{ hashFiles('bun.lock') }}-
      - run: bun run test:site
      - if: ${{ !inputs.release }}
        run: bun run test:site:dev
      - if: ${{ !inputs.release }}
        run: bun run test:site:hmr
